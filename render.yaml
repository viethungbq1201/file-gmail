services:
  - type: web
    name: file-gmail
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MAX_FILE_SIZE_MB
        value: "20"
      - key: MAX_TOTAL_SIZE_MB
        value: "25"
      # Bắt buộc: đặt trong phần "Environment" của service trên Render dashboard
      - key: APP_ACCESS_KEY
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GMAIL_RECIPIENT_EMAIL
        sync: false
      - key: GMAIL_CREDENTIALS_JSON
        sync: false
      # GMAIL_TOKEN_JSON chỉ dùng 1 lần để seed DB. Định dạng: {"me":"{...}"}
      - key: GMAIL_TOKEN_JSON
        sync: false
      - key: GMAIL_REDIRECT_URI
        sync: false
      - key: GMAIL_FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Lưu token vào Supabase để không phải cấu hình tay mỗi lần deploy
      - key: TOKEN_STORE
        value: db
      - key: DATABASE_URL
        sync: false